[project]
name = "yacht-co2"
version = "0.1.0"
description = "Traceable processing of underway CO2 observations from racing yachts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luke Gregor" }]
requires-python = ">=3.11"
dependencies = [
  "h5netcdf>=1.3",
  "h5py>=3.12",
  "loguru>=0.7",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "requests>=2.32",
  "scipy>=1.12",
  "typer>=0.12",
  "xarray>=2024.1",
  "zarr>=2.17,<3",
]

[project.optional-dependencies]
cmems = ["copernicusmarine>=2"]
era5 = ["dask[array]>=2024.2", "gcsfs>=2024.2"]
video = ["imageio-ffmpeg>=0.5"]
gui = [
    "nicegui>=2.0",
    "ruamel-yaml>=0.18",
]
# The double-clickable application. pywebview draws the window using whatever
# the platform already has -- WebKit on macOS, WebView2 on Windows -- and pulls
# its own bindings in for each. Linux is deliberately absent: its binding is
# GTK/WebKit2, a system library that cannot be frozen into a portable bundle,
# so the Linux application serves the same pages to the default browser.
desktop = [
    "nicegui>=2.0",
    "ruamel-yaml>=0.18",
    "pywebview>=5.3 ; sys_platform != 'linux'",
]

[dependency-groups]
# Only needed to *build* the application; the application itself needs none of it.
build = [
  "pyinstaller>=6.16",
  "pyinstaller-hooks-contrib>=2025.8",
]
dev = [
  "coverage>=7.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
yacht-co2 = "yacht_co2.cli:app"
yacht-co2-desktop = "yacht_co2.desktop:main"
zenodo-upload = "yacht_co2.zenodo:app"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
# The graphical interface is tested through NiceGUI's simulated browser,
# whose fixtures are async; nothing else in the suite is.
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/legacy_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.14"
packages = ["yacht_co2"]
ignore_missing_imports = true
