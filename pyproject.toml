[project]
name = "yacht-co2"
version = "0.1.0"
description = "Traceable processing of underway CO2 observations from racing yachts"
readme = "README.md"
license = "MIT"
authors = [{ name = "Luke Gregor" }]
requires-python = ">=3.11"
dependencies = [
  "h5netcdf>=1.3",
  "h5py>=3.12",
  "loguru>=0.7",
  "matplotlib>=3.8",
  "numpy>=1.26",
  "pandas>=2.2",
  "pillow>=10",
  "python-dotenv>=1.0",
  "pyyaml>=6",
  "requests>=2.32",
  "scipy>=1.12",
  "typer>=0.12",
  "xarray>=2024.1",
  "zarr>=2.17,<3",
]

[project.optional-dependencies]
cmems = ["copernicusmarine>=2"]
era5 = ["dask[array]>=2024.2", "gcsfs>=2024.2"]
video = ["imageio-ffmpeg>=0.5"]

[dependency-groups]
dev = [
  "coverage>=7.6",
  "mypy>=1.11",
  "pytest>=8.2",
  "pytest-cov>=5",
  "ruff>=0.6",
]

[project.scripts]
yacht-co2 = "yacht_co2.cli:app"
zenodo-upload = "yacht_co2.zenodo:app"

[build-system]
requires = ["uv_build>=0.9.9,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/legacy_code"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.14"
packages = ["yacht_co2"]
ignore_missing_imports = true
