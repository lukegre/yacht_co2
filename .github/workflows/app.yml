name: Application

# PyInstaller freezes for the machine it runs on, so each platform's
# application is built on that platform and nowhere else. This is the matrix
# that gives all four, and the job that attaches them to a tagged release.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch: # Pull requests do not produce a release, but they do prove the bundles still

  # build, which is the half of this that breaks when a dependency moves.
  pull_request:
    paths:
    - "packaging/**"
    - "pyproject.toml"
    - "uv.lock"
    - "src/yacht_co2/desktop.py"
    - "src/yacht_co2/gui/**"
    - ".github/workflows/app.yml"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-14, label: macOS (Apple Silicon) }
        - { os: windows-latest, label: Windows }
        # The oldest runner still supported: a bundle built against one glibc
        # will not start against an older one, so the build machine sets the
        # floor for every machine that can run the result.
        - { os: ubuntu-22.04, label: Linux }
        # comment out macos intel because it's slooow
        # - { os: macos-15-intel, label: macOS (Intel) }
    steps:
    - uses: actions/checkout@v7

    - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with: { enable-cache: true }

    - name: Install the application and its build tools
      run: uv sync --locked --extra desktop --group build

    - name: Build
      run: uv run python packaging/build.py

    - name: Check that it starts
      # A bundle that builds and then cannot import itself is the failure
      # this whole file exists to catch, and it is invisible until something
      # runs it. There is no display on a runner, so the application is asked
      # for the one thing that exercises the frozen import graph end to end.
      run: uv run python packaging/smoke.py

    - uses: actions/upload-artifact@v7
      with:
        name: yacht-co2-${{ matrix.os }}
        path: |
          dist/*.zip
          dist/*.tar.gz
        if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v8
      with:
        path: artifacts
        merge-multiple: true
    - name: Create or update the release
      uses: softprops/action-gh-release@v3
      with:
        body: |
          Download the archive for your machine, unpack it, and open
          `yacht-co2` inside.

          macOS and Windows will both warn that the application is from an
          unidentified developer, because it is signed by nobody: on macOS,
          right-click it and choose Open; on Windows, choose More info and
          then Run anyway. README.md has the detail.

    - name: Upload the release archives
      # gh release upload has stalled here with no output for many minutes
      # (uploads.github.com transfer never finishing). Prefer curl: hard
      # --max-time per attempt and built-in retries on transient failures.
      timeout-minutes: 12
      env:
        GH_TOKEN: ${{ github.token }}
        # This job downloads artifacts only — there is no checkout — so gh
        # cannot discover the repository from .git and must be told explicitly.
        GH_REPO: ${{ github.repository }}
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        archives=(artifacts/*.zip artifacts/*.tar.gz)
        if (( ${#archives[@]} == 0 )); then
          echo "::error::No release archives were downloaded"
          exit 1
        fi

        ls -lh "${archives[@]}"

        release_json="$(gh api "repos/${GH_REPO}/releases/tags/${GITHUB_REF_NAME}")"
        upload_url="$(printf '%s' "$release_json" | jq -r '.upload_url' | sed 's/{?name,label}$//')"
        if [[ -z "$upload_url" || "$upload_url" == null ]]; then
          echo "::error::Could not resolve release upload URL for ${GITHUB_REF_NAME}"
          exit 1
        fi

        # Replace any asset already on the release so a re-run does not 422 on
        # the name, then POST the bytes with an explicit transfer deadline.
        for archive in "${archives[@]}"; do
          name="$(basename "$archive")"
          echo "Preparing ${name}"

          asset_id="$(
            printf '%s' "$release_json" \
              | jq -r --arg name "$name" 'first(.assets[] | select(.name == $name) | .id) // empty'
          )"
          if [[ -n "$asset_id" ]]; then
            echo "Removing existing asset id=${asset_id} (${name})"
            gh api -X DELETE "repos/${GH_REPO}/releases/assets/${asset_id}"
            release_json="$(
              printf '%s' "$release_json" \
                | jq --argjson id "$asset_id" '.assets |= map(select(.id != $id))'
            )"
          fi

          echo "Uploading ${name}"
          # curl, not gh: gh release upload has hung here with no output. Bound
          # the transfer (--max-time) and retry transient 5xx/timeouts only.
          # Keep going if curl exits non-zero (e.g. timeout after retries) so the
          # HTTP status / body still reach the explicit error path below.
          set +e
          http_code="$(
            curl --silent --show-error --location \
              --retry 3 --retry-delay 10 \
              --retry-connrefused \
              --connect-timeout 30 --max-time 300 \
              -o /tmp/release-upload-body.json -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/octet-stream" \
              --data-binary "@${archive}" \
              "${upload_url}?name=$(printf '%s' "$name" | jq -sRr @uri)"
          )"
          curl_status=$?
          set -e
          if [[ $curl_status -ne 0 || ( "$http_code" != 201 && "$http_code" != 200 ) ]]; then
            echo "::error file=${archive}::Upload failed (curl exit ${curl_status}, HTTP ${http_code:-none})"
            cat /tmp/release-upload-body.json || true
            exit 1
          fi
          echo "Uploaded ${name} (HTTP ${http_code})"
        done
