name: Application

# PyInstaller freezes for the machine it runs on, so each platform's
# application is built on that platform and nowhere else. This is the matrix
# that gives all four, and the job that attaches them to a tagged release.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch: # Pull requests do not produce a release, but they do prove the bundles still

  # build, which is the half of this that breaks when a dependency moves.
  pull_request:
    paths:
    - "packaging/**"
    - "pyproject.toml"
    - "uv.lock"
    - "src/yacht_co2/desktop.py"
    - "src/yacht_co2/gui/**"
    - ".github/workflows/app.yml"

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
        - { os: macos-14, label: macOS (Apple Silicon) }
        - { os: windows-latest, label: Windows }
        # The oldest runner still supported: a bundle built against one glibc
        # will not start against an older one, so the build machine sets the
        # floor for every machine that can run the result.
        - { os: ubuntu-22.04, label: Linux }
        # comment out macos intel because it's slooow
        # - { os: macos-15-intel, label: macOS (Intel) }
    steps:
    - uses: actions/checkout@v4

    - uses: astral-sh/setup-uv@v6
      with: { enable-cache: true }

    - name: Install the application and its build tools
      run: uv sync --locked --extra desktop --group build

    - name: Build
      run: uv run python packaging/build.py

    - name: Check that it starts
      # A bundle that builds and then cannot import itself is the failure
      # this whole file exists to catch, and it is invisible until something
      # runs it. There is no display on a runner, so the application is asked
      # for the one thing that exercises the frozen import graph end to end.
      run: uv run python packaging/smoke.py

    - uses: actions/upload-artifact@v4
      with:
        name: yacht-co2-${{ matrix.os }}
        path: |
          dist/*.zip
          dist/*.tar.gz
        if-no-files-found: error

  release:
    name: Attach to the release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - uses: softprops/action-gh-release@v3
      with:
        # Large archives are more reliable when sent to GitHub's release API
        # one at a time rather than as concurrent uploads.
        preserve_order: true
        files: |
          artifacts/*.zip
          artifacts/*.tar.gz
        body: |
          Download the archive for your machine, unpack it, and open
          `yacht-co2` inside.

          macOS and Windows will both warn that the application is from an
          unidentified developer, because it is signed by nobody: on macOS,
          right-click it and choose Open; on Windows, choose More info and
          then Run anyway. README.md has the detail.
